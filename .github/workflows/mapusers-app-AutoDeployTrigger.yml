name: Trigger auto deployment for mapusers-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/mapusers-app-AutoDeployTrigger-630e9700-6cbb-4eb2-b209-c7d773ee68d9.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MAPUSERSAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MAPUSERSAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MAPUSERSAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/CityMapApp
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: thrivelocationacr.azurecr.io
          registryUsername: ${{ secrets.MAPUSERSAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.MAPUSERSAPP_REGISTRY_PASSWORD }}
          containerAppName: mapusers-app
          resourceGroup: thrive
          imageToBuild: thrivelocationacr.azurecr.io/mapusers-app:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


